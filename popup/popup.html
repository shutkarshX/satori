<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sato Quick Assist</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <!-- Header -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-glyph">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <h1>SATO</h1>
          <span class="version-tag">v1.8</span>
        </div>
      </div>
      <div class="status-indicator" id="conn-status" title="Active on page">
        <span class="live-dot"></span>
        <span class="live-label">LIVE</span>
      </div>
    </header>

    <!-- Hotkey Cheatsheet -->
    <section class="shortcuts-card">
      <div class="section-title">QUICK COMMANDS</div>
      <div class="shortcut-row">
        <span class="shortcut-desc">Fast-Path MCQ (Direct)</span>
        <span class="key-combo"><kbd>Alt</kbd><span>+</span><kbd>B</kbd></span>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-desc">AI Code Solver</span>
        <span class="key-combo"><kbd>Alt</kbd><span>+</span><kbd>C</kbd></span>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-desc">AI MCQ Solver</span>
        <span class="key-combo"><kbd>Alt</kbd><span>+</span><kbd>M</kbd></span>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-desc">Paste &amp; Format Code</span>
        <span class="key-combo"><kbd>Alt</kbd><span>+</span><kbd>V</kbd></span>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-desc">Follow-up Solver</span>
        <span class="key-combo"><kbd>Alt</kbd><span>+</span><kbd>F</kbd></span>
      </div>
    </section>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="trigger-btn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        <span>Run Solver</span>
      </button>

      <button id="paste-btn" class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
        <span>Paste Clipboard</span>
      </button>

      <button id="stop-btn" class="btn btn-danger">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <rect x="5" y="5" width="14" height="14" rx="2"></rect>
        </svg>
        <span>Stop Process</span>
      </button>
    </div>

    <!-- Status Bar -->
    <footer class="footer-bar">
      <div id="status-bar" class="status-text">Ready</div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
