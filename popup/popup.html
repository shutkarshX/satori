<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sato</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Clean Minimalist Header -->
    <div class="hero">
      <img src="../icons/icon-48.png" alt="Sato" class="app-icon">
      <div class="hero-info">
        <div class="title-row">
          <span class="app-title">Sato Assist</span>
          <span class="badge">PRO</span>
        </div>
        <p class="app-sub">Active &amp; ready on supported pages</p>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="action-grid">
      <button id="trigger-btn" class="action-card primary-card">
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div class="action-meta">
          <span class="action-name">Run AI Solver</span>
          <span class="action-hint">Extracts &amp; inserts code</span>
        </div>
        <span class="hotkey-pill">Alt C</span>
      </button>

      <button id="paste-btn" class="action-card">
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          </svg>
        </div>
        <div class="action-meta">
          <span class="action-name">Paste Clipboard</span>
          <span class="action-hint">Bypasses paste locks</span>
        </div>
        <span class="hotkey-pill">Alt V</span>
      </button>
    </div>

    <!-- Shortcuts List -->
    <div class="list-section">
      <div class="list-label">SHORTCUTS</div>
      
      <div class="list-item">
        <span class="item-text">Fast-path MCQ (Instant)</span>
        <span class="item-kbd"><kbd>Alt</kbd> <kbd>B</kbd></span>
      </div>

      <div class="list-item">
        <span class="item-text">AI MCQ Auto-picker</span>
        <span class="item-kbd"><kbd>Alt</kbd> <kbd>M</kbd></span>
      </div>

      <div class="list-item">
        <span class="item-text">AI Follow-up Solve</span>
        <span class="item-kbd"><kbd>Alt</kbd> <kbd>F</kbd></span>
      </div>

      <div class="list-item">
        <span class="item-text">Side-by-side Gemini</span>
        <span class="item-kbd"><kbd>Alt</kbd> <kbd>G</kbd></span>
      </div>
    </div>

    <!-- Footer Controls -->
    <div class="footer">
      <button id="stop-btn" class="abort-link">Abort active run</button>
      <span id="status-bar" class="status-indicator">Ready</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
