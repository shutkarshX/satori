<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satori</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../icons/icon-48.png" alt="Satori" class="icon">
      <div class="meta">
        <h1 class="title">Satori</h1>
        <span class="status" id="status-bar">Ready</span>
      </div>
    </div>

    <div class="buttons">
      <button id="trigger-btn" class="btn primary">
        <span>Run Solver</span>
        <kbd>Alt C</kbd>
      </button>

      <button id="paste-btn" class="btn">
        <span>Paste Editor</span>
        <kbd>Alt V</kbd>
      </button>
    </div>

    <div class="keys">
      <div class="key-row">
        <span>Fast MCQ</span>
        <kbd>Alt B</kbd>
      </div>
      <div class="key-row">
        <span>AI MCQ</span>
        <kbd>Alt M</kbd>
      </div>
      <div class="key-row">
        <span>Follow-up</span>
        <kbd>Alt F</kbd>
      </div>
      <div class="key-row">
        <span>Side Gemini</span>
        <kbd>Alt G</kbd>
      </div>
    </div>

    <button id="stop-btn" class="btn-cancel">Stop active task</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
