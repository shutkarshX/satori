<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satori</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><strong>Satori</strong><span class="badge">practice only</span></header>
  <label for="mode">Question type</label>
  <select id="mode"><option value="mcq">MCQ</option><option value="coding">Coding</option></select>
  <label for="provider">AI provider</label>
  <select id="provider"><option value="google">Google AI Mode</option><option value="gemini">Gemini (next adapter)</option><option value="chatgpt">ChatGPT (next adapter)</option></select>
  <button id="extract">Read current question</button>
  <textarea id="question" placeholder="Select question text on the page, or click Read current question."></textarea>
  <label for="extra">Optional instructions</label>
  <input id="extra" placeholder="e.g. use Python 3.11">
  <button id="googleSearch" class="primary">Search Google & show AI Overview</button>
  <div id="aiStatus" class="ai-status idle">Idle — ready for a question</div>
  <details id="diagnostics"><summary>Diagnostics</summary><pre id="diagnosticLog">No request yet.</pre></details>
  <label id="responseLabel" for="response">Latest AI response</label>
  <textarea id="response" readonly placeholder="The selected provider response will appear here."></textarea>
  <hr>
  <label for="draft">Reviewed answer/code to type into the assignment</label>
  <textarea id="draft" placeholder="Click the assignment editor first, then put reviewed text here."></textarea>
  <label class="check"><input type="checkbox" id="append"> append instead of replace</label>
  <button id="type">Type into focused assignment editor</button>
  <p id="status" role="status"></p>
  <small>AI providers run in the background. Final review and submission stay manual.</small>
  <script src="popup.js"></script>
</body>
</html>
